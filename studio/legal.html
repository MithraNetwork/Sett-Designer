<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sett · juridisch (print)</title>
<!-- The terms and the privacy statement as an A4 document in Sett's style, from the same
     text as the pages (v2-content.js, LEGAL). ?doc=voorwaarden or ?doc=privacy.
     studio/legal/make-pdf.mjs prints it to framer/assets/legal/<file>.pdf -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600&display=block" rel="stylesheet">
<style>
  :root{ --ink:#060C1A; --paperInk:#0B0E1A; --muted:#5C5C5E; --text:#2B2F3A; --lime:#8DFF66; --line:rgba(11,14,26,.1); }
  @page{ size:A4; margin:22mm 0 24mm; }
  @page :first{ margin-top:0; }
  *{ box-sizing:border-box; }
  html, body{ margin:0; background:#fff; }
  #doc > :not(.band){ margin-left:18mm; margin-right:18mm; }
  body{ font-family:"Outfit", system-ui, sans-serif; color:var(--text); font-size:10.5pt; line-height:1.6; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .mono{ font-family:"Geist Mono", ui-monospace, monospace; }
  /* the first page: a dark band with the logo and the title */
  .band{ background:var(--ink); color:#F4F6FB; margin:0; padding:16mm 18mm 13mm; border-radius:0 0 7mm 7mm; }
  .band .top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:22mm; }
  .band svg{ width:34mm; height:auto; fill:#fff; }
  .band .top span{ font-size:7.5pt; letter-spacing:.14em; text-transform:uppercase; color:rgba(223,228,244,.6); text-align:right; line-height:1.7; }
  .eyebrow{ display:inline-flex; align-items:center; gap:2.4mm; font-size:8pt; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--lime); margin-bottom:5mm; }
  .eyebrow::before{ content:""; width:2mm; height:2mm; border-radius:50%; background:var(--lime); }
  h1{ font-weight:800; font-size:38pt; line-height:.98; letter-spacing:-.03em; margin:0 0 7mm; }
  .band p{ margin:0; max-width:130mm; font-size:11.5pt; line-height:1.55; color:rgba(223,228,244,.82); }
  .band .date{ margin-top:7mm; font-size:8pt; letter-spacing:.1em; text-transform:uppercase; color:rgba(223,228,244,.6); }
  /* contents */
  .toc{ margin:11mm 0 4mm; padding:0 0 8mm; border-bottom:1px solid var(--line); }
  .toc b{ display:block; font-size:7.5pt; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:3.5mm; }
  .toc ol{ list-style:none; margin:0; padding:0; columns:2; column-gap:10mm; }
  .toc li::before{ display:none; }
  .toc li{ padding-left:0; display:flex; gap:3mm; padding:1.1mm 0; break-inside:avoid; color:var(--paperInk); font-size:10pt; }
  .toc li i{ font-style:normal; font-size:7.5pt; color:var(--muted); padding-top:.6mm; width:5mm; flex:none; }
  /* the articles */
  section{ padding:7mm 0 1mm; break-inside:auto; }
  section + section{ border-top:1px solid var(--line); }
  h2{ display:flex; align-items:baseline; gap:3.5mm; font-weight:800; font-size:14.5pt; line-height:1.25; letter-spacing:-.01em; color:var(--paperInk); margin:0 0 3.5mm; break-after:avoid; }
  h2 i{ font-style:normal; font-size:8pt; font-weight:600; letter-spacing:.06em; color:var(--muted); flex:none; }
  p{ margin:0 0 3mm; orphans:3; widows:3; }
  ul{ list-style:none; margin:0 0 3mm; padding:0; }
  li{ position:relative; padding-left:5.5mm; margin:0 0 1.8mm; break-inside:avoid; }
  li::before{ content:""; position:absolute; left:.4mm; top:2.2mm; width:2mm; height:2mm; border-radius:50%; background:var(--lime); box-shadow:0 0 0 .35mm rgba(11,14,26,.25); }
  li b{ color:var(--paperInk); font-weight:700; }
  .id{ margin-top:8mm; padding:5mm 6mm; border-radius:4mm; background:#F6F6F6; font-size:8pt; line-height:1.7; color:var(--muted); break-inside:avoid; }
  .id strong{ color:var(--paperInk); font-family:"Outfit", sans-serif; font-size:10pt; display:block; margin-bottom:1mm; }
  @media screen{ body{ max-width:210mm; margin:24px auto; padding:0 0 24mm; box-shadow:0 0 0 1px #ddd; } }
</style>
</head>
<body>
<div id="doc"></div>
<script type="module">
import { LEGAL } from "./v2-content.js"
const key = new URLSearchParams(location.search).get("doc") || "voorwaarden"
const d = LEGAL[key]
// the Sett logo, from the menu component (one path)
const nav = await (await fetch("/framer/SettNav.tsx")).text()
const logo = (nav.match(/const LOGO_D = "([^"]+)"/) || [])[1] || ""
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
const body = (text) => {
  const blocks = []
  for (const line of text.split("\n")) {
    const t = line.trim()
    if (!t) { blocks.push({ list: false, lines: [] }); continue }
    const list = /^- /.test(t), last = blocks[blocks.length - 1]
    if (last && last.list === list && (list || !last.lines.length)) last.lines.push(list ? t.slice(2) : t)
    else blocks.push({ list, lines: [list ? t.slice(2) : t] })
  }
  return blocks.filter((b) => b.lines.length).map((b) => b.list
    ? "<ul>" + b.lines.map((l) => { const c = l.indexOf(": "); return "<li>" + (c > 0 && c < 48 ? "<b>" + esc(l.slice(0, c)) + ":</b> " + esc(l.slice(c + 2)) : esc(l)) + "</li>" }).join("") + "</ul>"
    : "<p>" + esc(b.lines.join(" ")) + "</p>").join("")
}
const n = (i) => String(i + 1).padStart(2, "0")
const web = key === "privacy" ? "sett.nl/privacy" : "sett.nl/voorwaarden"
document.title = "Sett · " + d.title
document.getElementById("doc").innerHTML =
  '<div class="band"><div class="top"><svg viewBox="0 0 130 66.338" role="img" aria-label="Sett"><path d="' + logo + '"/></svg><span class="mono">' + web + '<br>info@sett.nl</span></div>' +
  '<div class="eyebrow mono">' + esc(d.eyebrow) + '</div><h1>' + esc(d.title) + '</h1><p>' + esc(d.intro) + '</p><div class="date mono">Laatst bijgewerkt: ' + esc(d.updated) + '</div></div>' +
  '<div class="toc"><b class="mono">Inhoud</b><ol>' + d.sections.map((s, i) => '<li><i class="mono">' + n(i) + '</i>' + esc(s.title) + '</li>').join("") + '</ol></div>' +
  d.sections.map((s, i) => '<section><h2><i class="mono">' + n(i) + '</i>' + esc(s.title) + '</h2>' + body(s.body) + '</section>').join("") +
  '<div class="id mono"><strong>Bedrijfsgegevens</strong>' + esc(d.id).replace(/ · /g, "<br>") + '<br>Online: ' + web + '</div>'
await document.fonts.ready
window.__ready = true
</script>
</body>
</html>
