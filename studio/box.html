<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sett studio — interactive box</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  html,body{ margin:0; font-family:Outfit, system-ui, sans-serif; color:#111212; background:#F7EDD5; transition:background .3s ease; }
  body.dark{ background:#0D1130; color:#fff; }
  header{ max-width:1100px; margin:0 auto; padding:64px 24px 8px; }
  .kicker{ font:500 14px "Geist Mono", monospace; color:#6b6f78; margin:0 0 10px; }
  body.dark .kicker{ color:#97a0c2; }
  h1{ font-size:clamp(30px, 4vw, 56px); line-height:1.05; margin:0 0 12px; font-weight:800; letter-spacing:-0.015em; }
  header p{ margin:0; font-size:18px; line-height:1.55; max-width:680px; color:#4a5270; }
  body.dark header p{ color:#c3c9dc; }
  #box{ position:relative; width:100%; max-width:1100px; height:min(72vh, 720px); margin:0 auto 64px; }
  @media (max-width:760px){ #box{ height:78vh; } header{ padding-top:40px; } }
  .bar{ position:fixed; right:16px; bottom:16px; z-index:10; display:flex; flex-wrap:wrap; gap:6px; padding:6px; border-radius:22px;
    background:rgba(8,11,28,0.78); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.12); max-width:calc(100vw - 32px); }
  .bar a, .bar button{ font:600 13px Outfit, system-ui; color:#dfe4f2; background:none; border:0; padding:8px 14px; border-radius:999px; cursor:pointer; text-decoration:none; }
  .bar a:hover, .bar button:hover{ background:rgba(255,255,255,0.1); }
  .bar button.on{ background:#fff; color:#0D1130; }
</style>
<script>
// ?headless: automated screenshots run in a background tab, which pauses
// animation frames. Only with the flag — a normal visit is untouched.
if (/[?&]headless\b/.test(location.search)) {
  Object.defineProperty(document, "hidden", { get: () => false })
  window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16)
  window.cancelAnimationFrame = (id) => clearTimeout(id)
}
</script>
</head>
<body>
<header>
  <p class="kicker">Sett is je energiehub</p>
  <h1>Neem je energievoorziening in eigen hand.</h1>
  <p>Gecertificeerde LiFePO4-accu's. Stalen bak (thermisch verzinkt). Draai de Sett rond en open hem om te zien waar alles op gebouwd is.</p>
</header>
<div id="box"></div>

<nav class="bar">
  <button data-k="autoRotate" class="on">Auto-rotate</button>
  <button data-k="always">Hotspots altijd</button>
  <button data-k="startExploded">Start geopend</button>
  <button id="bg">Donker</button>
  <a href="./">← Sett Designer</a>
</nav>

<script type="module">
import React from "https://esm.sh/react@18.3.1"
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client"
import SettBox3D from "./lib/SettBox3D.js"

const root = createRoot(document.getElementById("box"))
const opts = { autoRotate: true, always: false, startExploded: false }
let key = 0
function render(remount) {
  if (remount) key++ // "start opened" only applies to a fresh mount
  root.render(React.createElement(SettBox3D, {
    key,
    modelUrl: "/framer/sett-box.glb",
    autoRotate: opts.autoRotate,
    showHotspots: opts.always ? "always" : "exploded",
    startExploded: opts.startExploded,
    onToggle: (open) => console.log("SettBox3D:", open ? "opened" : "closed"),
  }))
}
render()
document.querySelectorAll(".bar button[data-k]").forEach((b) =>
  b.addEventListener("click", () => {
    const k = b.dataset.k
    opts[k] = !opts[k]
    b.classList.toggle("on", opts[k])
    render(k === "startExploded")
  })
)
document.getElementById("bg").addEventListener("click", (e) => {
  document.body.classList.toggle("dark")
  e.currentTarget.classList.toggle("on")
})
</script>
</body>
</html>
