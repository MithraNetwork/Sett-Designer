<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sett screenshots</title>
<style>
  :root{ --bg:#f3f1ec; --ink:#111212; --dim:#6b6f78; --line:#dcd8cf; }
  body{ margin:0; font:14px/1.45 "Outfit", system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header{ padding:16px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
  header h1{ font-size:16px; margin:0 12px 0 0; }
  header a{ color:inherit; }
  #status{ color:var(--dim); }
  .filter{ display:inline-flex; gap:4px; padding:3px; border:1px solid var(--line); border-radius:999px; background:#fff; }
  .filter button{ font:inherit; border:0; background:transparent; border-radius:999px; padding:5px 12px; cursor:pointer; color:var(--dim); }
  .filter button.on{ background:var(--ink); color:#fff; }
  main{ padding:20px; display:flex; flex-direction:column; gap:28px; }
  section h2{ margin:0 0 10px; font-size:15px; display:flex; gap:10px; align-items:baseline; }
  section h2 a{ font-size:12px; font-weight:400; color:var(--dim); }
  .row{ display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; }
  figure{ margin:0; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; width:min(100%, 420px); }
  figure.mobile{ width:min(100%, 200px); }
  figure button.shot{ all:unset; display:block; width:100%; cursor:zoom-in; background:#060C1A; }
  figure img{ display:block; width:100%; height:auto; }
  figcaption{ padding:10px 12px; font-size:12px; color:var(--dim); display:flex; flex-direction:column; gap:4px; }
  figcaption b{ color:var(--ink); font-weight:600; }
  figcaption .links{ display:flex; gap:12px; }
  figcaption a{ color:var(--ink); }
  body.only-desktop figure.mobile, body.only-mobile figure.desktop{ display:none; }
  /* the full screenshot, scrollable, on top of the page */
  #view{ position:fixed; inset:0; z-index:10; background:rgba(8,10,16,.92); display:none; overflow:auto; }
  #view.on{ display:block; }
  #view img{ display:block; margin:56px auto 40px; max-width:calc(100% - 32px); box-shadow:0 20px 60px rgba(0,0,0,.5); }
  #view .bar{ position:fixed; top:0; left:0; right:0; display:flex; gap:14px; align-items:center; padding:12px 16px; background:rgba(8,10,16,.85); color:#fff; font-size:13px; }
  #view .bar a{ color:#fff; }
  #view .bar button{ margin-left:auto; font:inherit; border:1px solid rgba(255,255,255,.3); background:transparent; color:#fff; border-radius:999px; padding:5px 14px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Sett screenshots</h1>
  <div class="filter" role="group" aria-label="Formaat">
    <button data-f="all" class="on">Alles</button>
    <button data-f="desktop">Desktop</button>
    <button data-f="mobile">Mobiel</button>
  </div>
  <span id="status">laden…</span>
  <a href="./index.html" style="margin-left:auto">← Render studio</a>
  <a href="./v2.html">V2-pagina's →</a>
</header>
<main id="list"></main>
<div id="view" role="dialog" aria-modal="true" aria-label="Screenshot">
  <div class="bar"><b id="vname"></b><a id="vopen" target="_blank">Openen in nieuw tabblad</a><a id="vdl" download>Download</a><button id="vclose">Sluiten (Esc)</button></div>
  <img id="vimg" alt="" />
</div>
<script type="module">
// the list comes from screenshots/index.json, written by the stitch script
const ORDER = ["details", "particulieren", "bedrijven", "gemeenten", "contact", "qa", "over", "preorder", "partners", "bevestigd", "roadmap", "bedankt", "blog", "artikel", "voorwaarden", "privacy"]
const TITLE = { details: "Wat is Sett? (/details)", particulieren: "Particulieren", bedrijven: "Bedrijven", gemeenten: "Gemeenten", contact: "Contact", qa: "Q&A", over: "Over ons", preorder: "Pre-order", partners: "Partners", bevestigd: "Bestelling bevestigd", roadmap: "Roadmap", bedankt: "Bedankt", blog: "Blog", artikel: "Blogartikel (voorbeeld)", voorwaarden: "Algemene voorwaarden", privacy: "Privacyverklaring" }
const list = document.getElementById("list")
const status = document.getElementById("status")
let items = []
try {
  items = await (await fetch("./screenshots/index.json?v=" + Date.now())).json()
} catch {
  status.textContent = "geen screenshots gevonden (screenshots/index.json)"
}
const pages = [...new Set(items.map((i) => i.page))].sort((a, b) => (ORDER.indexOf(a) + 99) % 99 - (ORDER.indexOf(b) + 99) % 99)
const made = items.map((i) => i.made).sort().pop()
if (items.length) status.textContent = items.length + " screenshots · " + pages.length + " pagina's · gemaakt " + made
for (const p of pages) {
  const s = document.createElement("section")
  s.innerHTML = `<h2>${TITLE[p] || p} <a href="./v2.html#${p}">live bekijken →</a></h2><div class="row"></div>`
  const row = s.querySelector(".row")
  for (const it of items.filter((i) => i.page === p).sort((a, b) => (a.size === "desktop" ? -1 : 1))) {
    const f = document.createElement("figure")
    f.className = it.size
    const src = "./screenshots/" + it.file
    f.innerHTML = `<button class="shot" aria-label="${it.file} bekijken"><img src="./screenshots/thumbs/${it.file.replace(/\.png$/, ".jpg")}" alt="" loading="lazy" /></button>
      <figcaption><b>${it.file}</b><span>${it.size === "desktop" ? "Desktop" : "Mobiel"} · ${it.width} × ${it.height.toLocaleString("nl-NL")} px · ${String(it.mb).replace(".", ",")} MB</span>
      <span class="links"><a href="${src}" target="_blank">Openen</a><a href="${src}" download>Download</a></span></figcaption>`
    f.querySelector(".shot").addEventListener("click", () => show(it))
    row.appendChild(f)
  }
  list.appendChild(s)
}

const view = document.getElementById("view")
const vimg = document.getElementById("vimg")
function show(it) {
  const src = "./screenshots/" + it.file
  document.getElementById("vname").textContent = it.file
  document.getElementById("vopen").href = src
  document.getElementById("vdl").href = src
  vimg.src = src
  vimg.style.width = it.width + "px"
  view.classList.add("on")
  view.scrollTop = 0
  document.getElementById("vclose").focus()
}
const hide = () => (view.classList.remove("on"), vimg.removeAttribute("src"))
document.getElementById("vclose").addEventListener("click", hide)
view.addEventListener("click", (e) => e.target === view && hide())
addEventListener("keydown", (e) => e.key === "Escape" && hide())

for (const b of document.querySelectorAll(".filter button"))
  b.addEventListener("click", () => {
    document.querySelectorAll(".filter button").forEach((x) => x.classList.toggle("on", x === b))
    document.body.className = b.dataset.f === "all" ? "" : "only-" + b.dataset.f
  })
</script>
</body>
</html>
