<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sett studio — menu</title>
<style>
  html,body{ margin:0; font-family:Outfit, system-ui; }
  .band{ min-height:360px; }
  .light{ background:linear-gradient(180deg,#9CC4EE,#EFEFEF); }
  .dark{ background:#060C1A; }
  .label{ font:600 12px ui-monospace, monospace; letter-spacing:.1em; text-transform:uppercase; padding:14px 22px 0; color:#888; }
</style>
</head>
<body>
<div class="band light"><div class="label">Licht (op de huidige pagina's)</div><div id="a"></div></div>
<div class="band dark"><div class="label">Donker (op de V2-pagina's)</div><div id="b"></div></div>
<script type="module">
import React from "https://esm.sh/react@18.3.1"
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client"
import SettNav from "./lib/SettNav.js"
createRoot(document.getElementById("a")).render(React.createElement(SettNav, { theme: "light" }))
createRoot(document.getElementById("b")).render(React.createElement(SettNav, { theme: "dark" }))
</script>
</body>
</html>
