<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sett studio — scroll scenes</title>
<style>
  html,body{ margin:0; background:#000; color:#fff; font:500 14px Outfit, system-ui, sans-serif; }
  main{ max-width:1100px; margin:0 auto; padding:40vh 24px 60vh; display:flex; flex-direction:column; gap:22vh; }
  figure{ margin:0; }
  figcaption{ font:600 13px ui-monospace, monospace; color:#8DFF64; margin-bottom:10px; }
  .slot{ width:100%; }
  /* ?compare: 3D at half opacity over the PNG, to check they line up */
  .compare .slot img{ opacity:1 !important; }
  .compare .slot canvas{ opacity:.5; }
  .bar{ position:fixed; right:16px; bottom:16px; z-index:10; display:flex; gap:6px; padding:6px; border-radius:999px; background:rgba(8,11,28,.8); border:1px solid rgba(255,255,255,.12); }
  .bar a{ color:#dfe4f2; text-decoration:none; padding:8px 14px; border-radius:999px; font-weight:600; }
</style>
<script>
if (/[?&]headless\b/.test(location.search)) {
  Object.defineProperty(document, "hidden", { get: () => false })
  window.requestAnimationFrame = (cb) => setTimeout(() => cb(performance.now()), 16)
  window.cancelAnimationFrame = (id) => clearTimeout(id)
}
if (/[?&]compare\b/.test(location.search)) document.documentElement.classList.add("compare")
</script>
</head>
<body>
<main id="list"></main>
<nav class="bar"><a href="?compare">Vergelijk met PNG</a><a href="?">Normaal</a><a href="?card">Kaarten</a><a href="./">Studio</a></nav>
<script type="module">
import React from "https://esm.sh/react@18.3.1"
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client"
import SettScrollScene from "./lib/SettScrollScene.js"
import { SCROLL } from "./scroll.js"

const list = document.getElementById("list")
const q = new URLSearchParams(location.search)
const only = q.get("only"), asCard = q.has("card")
for (const [name, cfg] of Object.entries(SCROLL)) {
  if (only && only !== name) continue
  if (asCard && !cfg.card) continue
  const fig = document.createElement("figure")
  fig.innerHTML = "<figcaption>" + name + " · " + Object.entries(cfg).map(([k, v]) => k + " " + v).join(", ") + "</figcaption><div class='slot'></div>"
  list.appendChild(fig)
  const slot = fig.querySelector(".slot")
  // ?card: the full-bleed card version in a 16:10 box, like on the site
  if (asCard) Object.assign(slot.style, { aspectRatio: "16 / 10", borderRadius: "24px", overflow: "hidden", background: "#E3EEFC" })
  createRoot(slot).render(React.createElement(SettScrollScene, {
    model: "/framer/sett-scroll-" + name + ".glb",
    poster: { src: "/framer/assets/" + (asCard ? "card-" : "") + name + ".png" },
    framing: asCard ? "card" : "scene",
    mobile3D: true,
  }))
}
</script>
</body>
</html>
